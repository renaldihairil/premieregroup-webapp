; Premiere Group — PHP overrides for cPanel (PHP-FPM / CGI read this per-directory).
; Belt-and-suspenders for the session settings Auth::start() also applies with
; ini_set(); this file guarantees them even when ini_set() is locked by the host.
; It is NOT web-servable (the root .htaccess denies *.ini).

; Keep the server-side session file alive as long as the 7-day login cookie.
; Without this, PHP's session GC (default ~1440s on shared hosting) deletes the
; session while the cookie is still valid -> users get logged out at random.
session.gc_maxlifetime = 604800
session.cookie_lifetime = 604800

; Only accept session IDs this server issued (prevents orphan-file churn).
session.use_strict_mode = 1
session.use_only_cookies = 1

; Run GC rarely; a session file is still only removed once it is truly stale.
session.gc_probability = 1
session.gc_divisor = 1000
